[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sealdice-autocard"
version = "0.9.14"
description = "QQ Excel character-sheet importer and card renderer for SealDice"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0", "xlrd>=2.0.2,<3"]

[project.scripts]
autocard = "autocard.cli:main"

[tool.setuptools.packages.find]
include = ["autocard*"]
